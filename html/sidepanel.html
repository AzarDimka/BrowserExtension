<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side panel</title>
    <script src="../js/sidepanel.js"></script>
</head>
<body>
    <h1>Тест</h1>
    <div>
        <div>
            <label>Название заметки</label>
        </div>
        <input type="text">
        <select>
            <option>.md</option>
            <option>.txt</option>
        </select>
        <button id="save-note">Сохранить</button>
    </div>
    <div class="toolbar">
        <button data-format="bold">B</button>
        <button data-format="italic">I</button>
        <button data-format="list">.</button>
    </div>
    <div>
        <textarea id="text-area">
        </textarea>
    </div>

</body>
</html>
